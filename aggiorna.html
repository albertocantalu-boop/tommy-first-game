<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b2320">
  <title>Aggiornamento La Miniera Perduta</title>
  <style>
    html,body{height:100%;margin:0;background:#14100e;color:#e8ddd0;font-family:Trebuchet MS,Segoe UI,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    main{max-width:520px}.gem{font-size:54px}h1{color:#43e0d0}p{line-height:1.5}
  </style>
</head>
<body>
  <main>
    <div class="gem">💎</div>
    <h1>Aggiornamento del gioco…</h1>
    <p>Sto caricando la versione con 17 livelli.</p>
  </main>
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.filter(name => name.startsWith('la-miniera-perduta-')).map(name => caches.delete(name)));
      }
      location.replace('./?versione=17&aggiornamento=20260712');
    })().catch(() => location.replace('./?versione=17&aggiornamento=20260712'));
  </script>
</body>
</html>
